vocabulary:
  provider: Westinghouse Air Brake Technologies (Wabtec)
  description: >-
    Vocabulary and taxonomy for Wabtec Corporation, a leading global provider
    of equipment, systems, digital solutions, and value-added services for the
    freight rail and passenger transit industries. Covers fleet management,
    predictive maintenance, transportation management, signaling, and
    industrial IoT platform concepts.
  tags:
    - Railroad
    - Fleet Management
    - Predictive Maintenance
    - Transportation Management
    - Industrial IoT
    - Signaling
    - Digital Intelligence
  terms:
    - term: WabtecONE
      definition: >-
        Wabtec's integrated digital intelligence platform enabling railroads
        and industrial operators to connect embedded devices, transmit data
        to cloud or on-premise hosting, and access analytics dashboards for
        fleet management, predictive maintenance, and performance optimization.
      tags:
        - Digital Intelligence
        - Industrial IoT

    - term: RailConnect TMS
      definition: >-
        Wabtec's Transportation Management System — the backbone operational
        and inventory management system for railroads providing first mile,
        last mile connectivity, asset visibility, crew management, and
        operational automation.
      tags:
        - Transportation Management
        - Railroad

    - term: FleetONE
      definition: >-
        Wabtec's advanced fleet management system integrating condition
        monitoring data from asset monitoring devices installed on locomotives
        and railcars.
      tags:
        - Fleet Management
        - Condition Monitoring

    - term: CMMS
      definition: >-
        Condition Monitoring Management System — Wabtec's maintenance
        management platform that integrates telematics and condition monitoring
        data to support maintenance decision-making and work order management.
      tags:
        - Condition Monitoring
        - Predictive Maintenance

    - term: Locomotive
      definition: >-
        A self-propelled rail vehicle providing motive power for a train.
        Wabtec is a leading manufacturer of North American freight and
        passenger locomotives under the GE Transportation heritage brands
        (e.g., ES44AC, ET44AH).
      tags:
        - Railroad
        - Fleet Management

    - term: Predictive Maintenance
      definition: >-
        A maintenance strategy using real-time sensor data, telematics, and
        analytics to predict when equipment failure is likely, enabling
        maintenance to be performed before failure occurs.
      tags:
        - Predictive Maintenance
        - Condition Monitoring

    - term: Telematics
      definition: >-
        Combined telecommunications and informatics technology used to
        transmit real-time operational data (location, speed, fuel level,
        fault codes, performance metrics) from locomotives and railcars
        to central monitoring systems.
      tags:
        - Telematics
        - Industrial IoT

    - term: Fault Code
      definition: >-
        Diagnostic codes generated by onboard locomotive or equipment
        computers indicating detected faults or anomalies that may require
        maintenance attention.
      tags:
        - Condition Monitoring
        - Maintenance

    - term: PTC
      definition: >-
        Positive Train Control — a federally mandated safety technology system
        that automatically stops or slows trains to prevent collisions,
        derailments, and unauthorized track occupancy. Wabtec's I-ETMS is the
        most widely deployed PTC system in North America.
      tags:
        - Signaling
        - Safety

    - term: Road Number
      definition: >-
        A unique identifier number assigned to a specific locomotive by the
        railroad that owns or operates it, typically displayed prominently on
        the locomotive's cab.
      tags:
        - Railroad
        - Fleet Management

    - term: Crew Calling API
      definition: >-
        An integration API in RailConnect TMS that connects the transportation
        management system with external crew calling systems to automate
        train crew assignment.
      tags:
        - Transportation Management
        - API

    - term: GoLINC
      definition: >-
        Wabtec's advanced onboard computing hardware platform for locomotives,
        providing the foundation for digital intelligence, event recording,
        and connectivity solutions.
      tags:
        - Hardware
        - Digital Intelligence

    - term: Railcar Telematics
      definition: >-
        Monitoring and data transmission systems installed on freight railcars
        to track location, load status, temperature, and mechanical condition
        throughout the supply chain.
      tags:
        - Telematics
        - Freight

    - term: Blocking Table
      definition: >-
        In railroad operations, a table that defines how groups of cars
        (blocks) are classified and sorted at yards for delivery to
        destination terminals. Managed within RailConnect TMS.
      tags:
        - Transportation Management
        - Operations
